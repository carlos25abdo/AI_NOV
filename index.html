<script>
'use strict';
const S=[];const add=(day,title,body,notes='',type='standard')=>S.push({day,title,body,notes,type});const tag=t=>`<span class="tag">${t}</span>`;const cards=a=>`<div class="cards">${a.map(([a,b,c])=>`<div class="card"><div class="num">${a}</div><h3>${b}</h3><p>${c}</p></div>`).join('')}</div>`;const activity=(title,text,time='10 دقائق')=>`<div class="activity"><strong>🎯 ${title}</strong><p>${text}</p>${tag('⏱ '+time)} ${tag('عمل جماعي')}</div>`;const head=(t,sub='',section='')=>`<div class="section">${section}</div><h1 class="headline">${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}`;
add(0,'البداية',`<div class="hero"><div><span class="eyebrow">تجربة تعليمية تفاعلية · 3 أيام</span><h1 class="headline">الذكاء <em>الاصطناعي</em><br>من الفكرة إلى الإبداع</h1><p class="sub">ورشة لطلاب كلية الفنون والإعلام والسياحة والضيافة · جامعة مصراتة</p><div class="tags">${tag('3–5 نوفمبر 2026')}${tag('10:30 ص – 1:30 ظ')}${tag('تقديم: عبدالرحمن خليل')}</div><button class="btn gold" onclick="next(1)">ابدأ التجربة ←</button></div><div class="orb"><div class="center">✧</div></div></div>`,'ابدأ بسؤال الجمهور: أين تعاملتم مع الذكاء الاصطناعي اليوم؟ أخبرهم أن الدورة تعلم التفكير والتجريب لا حفظ أسماء البرامج.');
add(0,'خريطة التجربة',head('3 أيام. <em>تحديات حقيقية.</em>','كل يوم نتعلّم مهارة ونستخدمها للفوز بنقاط لصالح فرقنا.')+cards([['01','اكتشف','فهم الذكاء الاصطناعي + هندسة الأوامر'],['02','اصنع','الصور والمحتوى والفيديو والإعلام'],['03','نافس','مشاريع تخصصية + بطولة الفرق']]),'اقسم الطلاب إلى 4 فرق، وإذا كانوا كثيرين يمكن 6. اشرح أن جميع النقاط محفوظة على هذا الجهاز فقط.');
add(0,'قوانين اللعب',head('اليوم مش مجرد محاضرة!','اسأل، جرّب، ناقش، نافس، وتعلّم من المحاولة.')+cards([['+10','إجابة صحيحة','سؤال أو لغز سريع'],['+20','تطبيق ناجح','نتيجة عملية وشرح كيف وصلتم لها'],['+30','تحدي مميز','فكرة إبداعية قابلة للتنفيذ']])+`<p class="help">افتح 🏆 الفرق من الأعلى لتسمية الفرق وتسجيل النقاط.</p>`,'قبل البداية، افتح لوحة الفرق، اكتب أسماء 4 فرق على الأقل، ولا تعط النقاط للسرعة وحدها؛ كافئ الدقة والأخلاق والإبداع.');
add(1,'الفصل الأول',head('اليوم الأول<br><em>افهم. اسأل. جرّب.</em>','الهدف: تتقن أساسيات الذكاء الاصطناعي وتصنع أوامر ذكية بدل الطلبات الغامضة.','03 نوفمبر 2026 · 10:30–13:30')+`<div class="game-banner"><h2>DAY 01 — THINK SMART</h2><p>مهمتكم اليوم: تحويل سؤال عادي إلى أمر احترافي.</p></div>`,'التقسيم المقترح: مقدمة 30 د، أساسيات 35 د، استراحة 10 د، أوامر 45 د، ورشة 40 د، تحدي 20 د.');
add(1,'كسر الجليد',head('كم مرة استخدمت AI <em>اليوم؟</em>','فكر في التطبيقات التي استخدمتها منذ استيقظت.')+cards([['؟','التوصيات','ما الذي يظهر لك على مواقع التواصل؟'],['؟','الملاحة','كيف يقترح التطبيق الطريق؟'],['؟','المساعدة','هل استخدمت مساعدًا يكتب أو يبحث؟']])+activity('تصويت بالأيدي','من استخدم الذكاء الاصطناعي اليوم؟ من يظن أنه لم يستخدمه؟ ناقشوا الفرق بين AI التقليدي والتوليدي.','7 دقائق'),'لا تفترض أن كل خوارزمية توصية تعمل بنفس آلية الذكاء التوليدي. الهدف إثارة النقاش.');
add(1,'المفهوم',head('ما الذكاء <em>الاصطناعي؟</em>','أنظمة حاسوبية تنفذ مهام تتطلب عادةً قدرات مثل التعرف على الأنماط أو فهم اللغة أو التنبؤ.')+`<div class="cols"><div class="panel"><h3>الذكاء الاصطناعي التقليدي</h3><p>تصنيف الصور، التوصيات، التنبؤ بالمبيعات، اكتشاف الرسائل غير المرغوبة.</p></div><div class="panel"><h3>الذكاء الاصطناعي التوليدي</h3><p>إنشاء نصوص وصور وصوت ومقاطع فيديو ورموز برمجية جديدة استنادًا إلى الأنماط المتعلّمة.</p></div></div>`,'وضح أن التوليد لا يعني الحقيقة ولا الفهم البشري بالضرورة.');
add(1,'كيف يعمل',head('من البيانات إلى <em>النتيجة</em>','تصوّر مبسط: تدريب نموذج على أنماط → استلام تعليمات → إنتاج استجابة.')+cards([['1','التعلّم','النموذج يتعلم أنماطًا من بيانات التدريب'],['2','التوجيه','تكتب طلبًا واضحًا وتضع السياق'],['3','الإنتاج','يولّد استجابة محتملة يجب مراجعتها']]),'لا تقل إن النموذج يبحث تلقائيًا في الإنترنت أو أنه يتذكر حقائق دائمًا؛ ذلك يعتمد على الأداة والإعدادات.');
add(1,'أين يفيدني',head('الذكاء الاصطناعي <em>في تخصصك</em>')+cards([['🎨','الفنون','أفكار بصرية ولوحات مزاجية'],['🎙','الإعلام','أسئلة مقابلات وسيناريو محتوى'],['🧭','السياحة','وصف وجهات وبرامج رحلات'],['🏨','الضيافة','محاكاة خدمة العملاء ورسائل استقبال'],['📚','الدراسة','تنظيم أفكار ومراجعة مفاهيم'],['💼','العمل','عرض خدمات وخطط وأفكار مشاريع']]),'اسأل الطلاب عن مشكلة في تخصصاتهم، واستخدمها لاحقًا كمثال على المسرح.');
add(1,'قدرات وحدود',head('AI قوي… <em>لكنه ليس معصومًا.</em>')+`<div class="cols"><div class="panel"><h3>✅ يفيد في</h3><ul><li>توليد الخيارات</li><li>التلخيص وإعادة الصياغة</li><li>التخطيط والعصف الذهني</li><li>صياغة مسودات متعددة</li></ul></div><div class="panel"><h3>⚠️ انتبه إلى</h3><ul><li>اختلاق معلومات أو مراجع</li><li>التحيز والأخطاء</li><li>خصوصية البيانات</li><li>حقوق الآخرين وأعمالهم</li></ul></div></div>`,'وضح مثالًا على معلومة تاريخية عن معلم ليبي تحتاج التثبت من مصدر موثوق قبل نشرها.');
add(1,'اللعبة الأولى',head('🎮 أسطورة أم حقيقة؟','اختر الإجابة ثم اضغط كشف الإجابة.')+`<div id="quizMount"></div>`, 'استعمل 3 أسئلة متتابعة. النقاط للفرق بعد مناقشة السبب.', 'quiz');
add(1,'هندسة الأوامر',head('النتيجة تبدأ من <em>طريقة السؤال.</em>')+`<div class="cols"><div class="panel"><h3>❌ أمر ضعيف</h3><p class="bigquote">اكتب لي إعلانًا.</p><p>لمن؟ عن ماذا؟ بأي لغة؟ وأين سينشر؟</p></div><div class="panel"><h3>✅ أمر واضح</h3><p>اكتب إعلانًا من 70 كلمة لمعرض فني جامعي في مصراتة، موجهًا للطلاب، باللغة العربية المشوقة، مع دعوة للتسجيل.</p></div></div>`,'اطلب منهم توقع اختلاف النتائج عند استخدام نفس الأداة.');
add(1,'الوصفة الذهبية',head('5 عناصر لـ <em>Prompt احترافي</em>')+cards([['01','الدور','أنت خبير في…'],['02','المهمة','أريد منك أن…'],['03','السياق','الجمهور والمكان والهدف'],['04','القيود','الطول والنبرة وما يجب تجنبه'],['05','المخرج','جدول، نقاط، سيناريو، خطة…']]),'يمكن أن يتغير ترتيب العناصر؛ الأهم وضوح المطلوب والتحقق من النتيجة.');
add(1,'المختبر',head('مختبر <em>بناء الأوامر</em>','غيّر الخيارات وشاهد الأمر النهائي. انسخه وجربه في أداة الذكاء الاصطناعي.')+`<div id="labMount"></div>`,'اطلب من مشارك تعديل الخيارات أمام الجميع ثم اشرح لماذا تحسن الأمر.','lab');
add(1,'تحدي اليوم الأول',head('⚡ Prompt Battle','فريقان، نفس المهمة، من يكتب الأمر الأكثر وضوحًا؟')+`<div class="game-banner"><h2>المهمة: صمّم فكرة حملة لفعالية جامعية</h2><p>لديكم 6 دقائق لكتابة الأمر، ودقيقتان لعرض النتيجة وسبب اختياراتكم.</p></div>`+activity('معايير الفوز','وضوح الهدف 10 نقاط · فهم الجمهور 10 نقاط · جودة المخرجات 10 نقاط','10 دقائق'),'أظهر مؤقت 6 دقائق من زر المؤقت، ثم قيّم بعدالة عبر لوحة الفرق.');
add(1,'خلاصة اليوم',head('لا تحفظ الأوامر… <em>افهم كيف تبنيها.</em>','الفكرة الجيدة + طلب واضح + مراجعة بشرية = نتيجة أفضل.')+`<div class="bigquote">تحدي قبل الغد: احضر فكرة إعلان أو عمل إبداعي تريد تطويره بالذكاء الاصطناعي.</div>`,'اختتم بمراجعة 3 أسئلة شفوية.');

add(1,'مدرس سقراطي',head('خلّيه يسألك… <em>مش يحل بدل منك</em>')+`<div class="bigquote">أنت مدرّسي في مادة [اسم المادة]. لا تعطِني الإجابة مباشرة. اطرح سؤالًا واحدًا في كل مرة، وانتظر إجابتي، ثم أعطني تلميحًا وتصحيحًا عند الحاجة. ابدأ بتقييم مستواي.</div>`+activity('جرّب المدرس السقراطي','طالب يجيب أمام الحضور عن سؤال من تخصصه، والبقية تقيّم هل التلميحات مفيدة.','7 دقائق'),'استخدم السؤال التدريجي في التصميم: ما الفرق بين التوازن المتماثل وغير المتماثل؟ أو في الإعلام: كيف نتحقق من مصدر خبر؟');
add(1,'تحويل المحاضرة',head('من ملاحظات مبعثرة إلى <em>مادة للمذاكرة</em>')+`<div class="cols"><div class="panel"><h3>المدخلات</h3><p>نص محاضرة أو ملاحظاتك الشخصية دون معلومات حساسة، وبإذن عند مشاركة مواد لا تملك حق نشرها.</p></div><div class="panel"><h3>المخرجات</h3><p>ملخص منظم + مفاهيم أساسية + أمثلة + نقاط غير واضحة + أسئلة مراجعة.</p></div></div><div class="bigquote">لخص النص التالي اعتمادًا عليه فقط. استخرج 7 أفكار، و5 مصطلحات، و3 أسئلة مراجعة. ضع «غير مذكور» لأي معلومة غير موجودة، ولا تخترع مصادر.</div>`,'أظهر مثالًا من 5 أسطر من ملاحظات وهمية، وقارن الملخص بالمصدر. نبههم إلى أن جودة الملخص تعتمد على اكتمال الملاحظات.');
add(1,'اختبار نفسك',head('حوّل كل درس إلى <em>اختبار تفاعلي</em>')+cards([['01','استرجاع','أسئلة دون النظر للمحاضرة'],['02','تصحيح','تفسير الأخطاء لا مجرد الدرجة'],['03','إعادة','اختبر نقاط ضعفك مرة أخرى']])+`<div class="bigquote">من الملخص المرفق، أنشئ 5 أسئلة اختيار من متعدد بدرجات صعوبة مختلفة. اعرض سؤالًا واحدًا كل مرة، وانتظر إجابتي، ثم صحح مع ذكر الدليل من النص.</div>`+activity('تحدي الاسترجاع','اكتبوا 3 أسئلة من محاضرة واختبروا الفريق المقابل.','10 دقائق'),'الهدف استرجاع المعلومة لا نسخ الجواب؛ امنح نقاطًا على تفسير سبب صحة الإجابة.');
add(1,'خطة مذاكرة',head('خطتك قبل الامتحان… <em>واقعية</em>')+`<div class="bigquote">عندي امتحان بعد 7 أيام في [المادة]. لدي [عدد] محاضرات وساعتان يوميًا. أنشئ جدول مذاكرة يتضمن الفهم، الاسترجاع النشط، حل الأسئلة، المراجعة المتباعدة، والراحة. اسألني أولًا عن الموضوعات الأصعب.</div>`+cards([['1','تحديد','ما المطلوب تعلمه؟'],['2','توزيع','وقت للدروس الصعبة'],['3','قياس','اختبار قصير آخر كل يوم']]),'بيّن لهم لماذا لا يكتفون بإعادة قراءة الملخصات؛ إن أمكن أضف تمرين استدعاء بلا ملاحظات بعد الشرح.');
add(1,'مهارة التحقق',head('AI يجيب بثقة… <em>حتى حين يخطئ</em>')+cards([['؟','المعلومة','هل وردت في محاضرتك أو مرجع معتمد؟'],['؟','المرجع','هل المصدر موجود ومطابق للادعاء؟'],['؟','الوقت','هل قد تكون المعلومة متغيرة؟']])+activity('صيد الخطأ','اعرض إجابة فيها اقتباس أو مرجع غير موثوق، واطلب من الفرق اكتشاف ما يجب التحقق منه.','8 دقائق'),'لا تعرّف المرجع المختلق وكأنه حقيقي. ذكّر الطلاب أن طلب «أعطني مصادر» لا يكفي دون فتحها والتحقق.');
add(1,'تحدي الدراسة',head('🎮 معركة <em>أفضل معلّم AI</em>','كل فريق يصنع أمرًا يجعل أداة AI تعلّم زميلًا مفهومًا صعبًا.')+`<div class="game-banner"><h2>التحدي: افهم، ثم اشرح</h2><p>6 دقائق لتجهيز الأمر + 2 دقيقة لشرح المفهوم بلا مساعدة + دقيقة لتقييم الفريق المقابل.</p></div>`+activity('معايير النقاط','وضوح الأمر 10 · صحة الشرح 10 · قدرة الطالب على الشرح بنفسه 10','10 دقائق'),'اعط نقطة إضافية اختيارية لمن يكتشف معلومة تحتاج تحققًا.');

add(2,'الفصل الثاني',head('اليوم الثاني<br><em>من النص إلى الإبداع</em>','نصنع أفكارًا وصورًا ومحتوى بصريًا يناسب أعمالنا.','04 نوفمبر 2026 · 10:30–13:30')+`<div class="game-banner"><h2>DAY 02 — CREATE WITH AI</h2><p>مهمتكم: تحويل فكرة بسيطة إلى حملة إبداعية صغيرة.</p></div>`,'جدول اليوم: 20 د مراجعة، 40 د صورة، 35 د إعلام، 10 د استراحة، 35 د فيديو، 40 د تطبيق.');
add(2,'التفكير الإبداعي',head('الذكاء الاصطناعي <em>مساعد مبدع</em>','أنت صاحب الرؤية. هو يقترح خيارات، وأنت تختار وتعدّل وتتحمل مسؤولية النتيجة.')+cards([['💡','الفكرة','حدد الرسالة والجمهور'],['🧪','التجربة','اختبر عدة زوايا وأساليب'],['🎯','الاختيار','راجع الواقعية والجودة والأصالة']]),'شدد على أن العمل لا ينتهي عند أول نتيجة.');

add(2,'تجربة توليد',head('مثال: <em>بوستر سياحي</em>')+`<div class="bigquote">صمّم مفهومًا بصريًا لإعلان سياحي عن مدينة مصراتة، بأسلوب تصوير واقعي، إضاءة صباحية دافئة، تكوين واسع، ألوان بحرية هادئة، مساحة فارغة لعنوان عربي، مقاس عمودي 4:5. تجنب إضافة معالم غير مؤكدة.</div>`+activity('تحسين النتيجة','كل فريق يغيّر 3 عناصر في الوصف ثم يقارن الاختلاف.','12 دقيقة'),'هذه شريحة لكتابة أمر في أداة متاحة خارجيًا. توليد الصور نفسه يتطلب خدمة ذكاء اصطناعي.');
add(2,'تصميم مسؤول',head('هل يمكن نشر كل صورة <em>نولّدها؟</em>')+`<div class="cols"><div class="panel"><h3>افحص أولًا</h3><ul><li>هل تبدو الأماكن والأشخاص حقيقيين رغم أنهم خياليون؟</li><li>هل يضلّل المشاهد بشأن حدث أو خبر؟</li><li>هل لديك الحق في استخدام عناصر التصميم؟</li></ul></div><div class="panel"><h3>قرار مهني</h3><p>استخدم صورًا أصلية للأماكن حين يلزم إثبات واقعيتها، وميّز المشاهد التوضيحية والمولّدة عند الحاجة.</p></div></div>`,'تحدث عن أهمية عدم استخدام صور أشخاص دون إذن في سياقات حساسة.');
add(2,'الإعلام',head('الإعلام + AI = <em>سرعة تحتاج دقة</em>')+cards([['1','التحضير','محاور مقابلة وأسئلة'],['2','الإنتاج','مسودة خبر أو تعليق صوتي'],['3','المراجعة','تدقيق الأسماء والوقائع والمصادر']])+activity('غرفة الأخبار','اكتب خبرًا من 80 كلمة عن معرض جامعي افتراضي مع وضع جميع التفاصيل الافتراضية بوضوح.','10 دقائق'),'لا تولّد اقتباسات حقيقية أو تفاصيل أحداث على أنها حدثت.');

add(2,'قالب فيديو',head('Storyboard <em>في 20 ثانية</em>')+`<div class="cols"><div class="panel"><h3>المشهد 1 — 0:00–0:05</h3><p>لقطة ملفتة لأدوات الرسم. نص: كل فكرة تبدأ بخط.</p><h3>المشهد 2 — 0:05–0:10</h3><p>طالب يعمل على مشروع تصميم.</p></div><div class="panel"><h3>المشهد 3 — 0:10–0:15</h3><p>لقطات من مراحل العمل والتحسين.</p><h3>المشهد 4 — 0:15–0:20</h3><p>النتيجة النهائية مع دعوة لمشاهدة أعمال الطلاب.</p></div></div>`,'ابدأ بكتابة النص ومخطط المشاهد ثم قرر إن كانت هناك حاجة فعلية لتوليد فيديو.');
add(2,'أدوات اليوم',head('اختار الأداة <em>حسب المهمة</em>')+cards([['✍️','ChatGPT / Gemini','أفكار، شرح، نصوص ومراجعات'],['🖼️','Canva / Firefly','تصميم بصري وتعديل عناصر'],['🎬','CapCut','مونتاج وفيديو وتعليقات']])+`<p class="help">توفر الخدمات والمزايا المجانية يتغير؛ افتح الأداة التي لديك حساب يعمل فيها قبل بداية التدريب.</p>`,'لا تعتمد على أدوات تحتاج اشتراكًا وقت العرض دون تجربة مسبقة.');
add(2,'تحدي اليوم الثاني',head('🎨 تحدي وكالة الإعلان','كل فريق أصبح وكالة إبداعية لديها عميل حقيقي أو افتراضي.')+`<div class="game-banner"><h2>اصنع حملة من 3 مخرجات</h2><p>عنوان إعلاني + وصف صورة ترويجية + سيناريو فيديو 15 ثانية.</p></div>`+activity('وقت التنفيذ والعرض','15 دقيقة إنتاج، ثم دقيقة عرض لكل فريق. قيّم الرسالة والهوية والدقة.','25 دقيقة'),'استخدم المؤقت، واجعل الفرق تتبادل ملاحظات بناءة.');
add(2,'خاتمة اليوم',head('الفكرة أولًا، <em>الأداة ثانيًا.</em>','إذا استطعت وصف ما تريد بدقة، تستطيع توجيه أدوات متعددة نحو نفس الهدف.')+`<div class="bigquote">غدًا: ستستخدمون كل ما تعلمتموه لتقديم مشروع نهائي أمام الجميع.</div>`,'اذكر للفرق تجهيز أفكار المشروع وفق التخصص.');

add(2,'قراءة المقالات',head('اقرأ مقالًا علميًا <em>بذكاء</em>','AI يساعدك على الفهم، لكنه لا يحل محل قراءة المصدر.')+cards([['1','سؤال البحث','ما المشكلة التي يناقشها المقال؟'],['2','المنهج','كيف جمع الباحثون البيانات؟'],['3','النتائج','ما الذي وجدوه فعلًا؟'],['4','القيود','ما الذي لا تسمح به الدراسة؟']])+`<div class="bigquote">سأرفق نص مقال. استخرج سؤال البحث والمنهج والنتائج والقيود، مع اقتباس قصير أو موضع من النص لكل نتيجة. اكتب «غير محدد» عند غياب المعلومات.</div>`,'وضح الفرق بين الورقة البحثية ورأي منشور على الإنترنت. استخدم نصًا تدريبيًا مرخصًا أو مقطعًا كتبه المحاضر.');
add(2,'البحث الجامعي',head('من فكرة بحث إلى <em>خطة علمية</em>')+cards([['1','تحديد الموضوع','ضيّق موضوعك إلى سؤال قابل للبحث'],['2','الكلمات المفتاحية','عربية وإنجليزية للبحث في المكتبات'],['3','الخطة','عناوين وأقسام منطقية'],['4','التحقق','مصادر أصلية توثّق كل ادعاء']])+`<div class="bigquote">ساعدني على تضييق موضوع [الموضوع] إلى 3 أسئلة بحث مناسبة لمستوى البكالوريوس. لكل سؤال اقترح كلمات مفتاحية ومحاور محتملة، دون اختلاق مراجع أو نتائج.</div>`,'بيّن أن استخدام AI في البحث خاضع لتوجيهات الجامعة والمحاضر؛ لا تسلّم نصًا مولّدًا بوصفه بحثك الأصلي.');
add(2,'المصادر والمراجع',head('لا تسلّم مرجعًا <em>لم تفتحه بنفسك</em>')+`<div class="cols"><div class="panel"><h3>خطأ شائع</h3><p>نسخ أسماء المؤلفين والسنوات والروابط من إجابة مولّدة دون تحقق.</p></div><div class="panel"><h3>الطريقة الصحيحة</h3><p>ابحث في فهرس مكتبتك أو Google Scholar أو موقع الناشر، افتح المصدر، تحقق من بياناته، ثم وثقه.</p></div></div>`+activity('مرجع حقيقي أم مختلق؟','اعرض مرجعين تجريبيين؛ يحدد كل فريق كيف سيثبت وجودهما وملاءمتهما.','7 دقائق'),'لا توحي أن AI أداة تحقق نهائية؛ التأكد يكون من المصدر الأصلي.');
add(2,'تحضير البرزنتيشن',head('برزنتيشن جامعي <em>أفضل في نصف الخطوات</em>')+cards([['1','الفكرة','هدف واحد واضح للعرض'],['2','التسلسل','مقدمة، أمثلة، خلاصة'],['3','التصميم','نص قليل ورسوم ذات معنى'],['4','التدريب','أسئلة متوقعة وتوقيت']])+`<div class="bigquote">لدي عرض 7 دقائق عن [الموضوع] لزملائي. اقترح مخطط 6 شرائح: عنوان ورسالة أساسية لكل شريحة ومثال واقعي وملاحظة للمقدم. اجعل النص المرئي مختصرًا.</div>`,'اطلب منهم تحويل فقرة طويلة إلى 3 نقاط مع مثال مرئي، ثم التحدث من دون قراءة الشاشة.');

let current=Number(localStorage.getItem('ai_current')||0);if(current<0||current>=S.length)current=0;let showNotes=false;let quizI=0,quizRevealed=false;const questions=[{q:'هل كل إجابة من الذكاء الاصطناعي صحيحة؟',opts:['نعم دائمًا','لا، يجب التحقق','فقط لو كانت طويلة','إذا كُتبت بالعربية'],answer:1,why:'قد يختلق معلومات أو يخطئ حتى لو كانت صياغته واثقة.'},{q:'ما أكثر عنصر يساعد في تحسين الأمر؟',opts:['كتابة كلمة AI عشر مرات','طلب بلا تفاصيل','تحديد المهمة والسياق والمخرج','استخدام لغة إنجليزية فقط'],answer:2,why:'الوضوح والسياق والقيود عادةً أهم من زخرفة الطلب.'},{q:'هل يجوز نشر صورة مولدة على أنها توثيق لحدث حقيقي؟',opts:['نعم دون توضيح','إذا كانت جميلة','إذا حصلت على إعجابات','لا، فهذا قد يضلل الجمهور'],answer:3,why:'يجب عدم إيهام الجمهور بأن مشهدًا مولدًا يوثق واقعة حقيقية.'}];

let teams=JSON.parse(localStorage.getItem('ai_teams')||'null')||[{name:'فريق الإبداع',score:0},{name:'فريق المستقبل',score:0},{name:'فريق الابتكار',score:0},{name:'فريق التحدي',score:0}];function save(){localStorage.setItem('ai_current',current);localStorage.setItem('ai_teams',JSON.stringify(teams))}function render(){const s=S[current];document.getElementById('slide').innerHTML=s.body;document.getElementById('count').textContent=`${current+1} / ${S.length}`;document.getElementById('progress').style.width=((current+1)/S.length*100)+'%';document.getElementById('notes').innerHTML='<b class="presenterOnly">ملاحظات المحاضر:</b> '+(s.notes||'لا توجد ملاحظات.');document.querySelector('.stage').scrollTop=0;if(s.type==='quiz')renderQuiz();if(s.type==='lab')renderLab();if(s.type==='leaderboard')renderLeaderboard();save()}function next(delta){current=Math.max(0,Math.min(S.length-1,current+delta));render()}function jump(i){current=i;closeOverlay();render()}function goDay(d){jump(S.findIndex(s=>s.day===d))}function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}function toggleNotes(){showNotes=!showNotes;document.getElementById('notes').classList.toggle('open',showNotes)}
function openOverlay(type,mins){const o=document.getElementById('overlay'),b=document.getElementById('overlayBody'),t=document.getElementById('overlayTitle');o.classList.add('open');if(type==='map'){t.textContent='خريطة الشرائح — انتقل لأي عنوان';b.innerHTML=`<div class="thumbs">${S.map((s,i)=>`<button class="thumb ${i===current?'active':''}" onclick="jump(${i})"><small>${s.day?'اليوم '+s.day:'مقدمة'} · ${i+1}</small><b>${s.title}</b></button>`).join('')}</div>`}if(type==='teams'){t.textContent='لوحة الفرق والنقاط';b.innerHTML=`<div style="max-width:950px;margin:auto"><p class="help">عدّل الأسماء ثم امنح أو اخصم النقاط. تُحفظ النتائج محليًا على هذا المتصفح.</p><div class="scorelist" id="teamList"></div><div class="toolmenu" style="margin:18px 0"><button class="btn green" onclick="addTeam()">+ فريق جديد</button><button class="btn" onclick="exportScores()">تصدير النتائج CSV</button><button class="btn" onclick="resetScores()">تصفير النقاط</button></div></div>`;renderTeams()}if(type==='timer'){t.textContent='مؤقت النشاط';b.innerHTML=`<div style="max-width:800px;margin:auto;text-align:center"><div class="timerdigits" id="clock">05:00</div><div class="toolmenu" style="justify-content:center"><button class="btn" onclick="setTimer(3)">3 دقائق</button><button class="btn" onclick="setTimer(5)">5 دقائق</button><button class="btn" onclick="setTimer(10)">10 دقائق</button><button class="btn" onclick="setTimer(20)">20 دقيقة</button><button class="btn" onclick="setTimer(45)">45 دقيقة</button></div><div class="toolmenu" style="justify-content:center;margin-top:20px"><button class="btn gold" onclick="startTimer()">▶ ابدأ / استكمل</button><button class="btn" onclick="pauseTimer()">⏸ إيقاف</button><button class="btn" onclick="resetTimer()">↺ إعادة</button></div></div>`;setTimer(mins||5)}}function closeOverlay(){document.getElementById('overlay').classList.remove('open')}
function renderTeams(){const e=document.getElementById('teamList');if(!e)return;e.innerHTML=teams.map((x,i)=>`<div class="team"><div><input aria-label="اسم الفريق" class="input" style="max-width:220px" value="${esc(x.name)}" onchange="renameTeam(${i},this.value)"><div class="rowbtn" style="margin-top:10px"><button class="btn green" onclick="points(${i},10)">+10</button><button class="btn green" onclick="points(${i},20)">+20</button><button class="btn green" onclick="points(${i},30)">+30</button><button class="btn" onclick="points(${i},-10)">−10</button></div></div><span class="score">${x.score}</span></div>`).join('')}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function renameTeam(i,n){teams[i].name=n.slice(0,50)||('فريق '+(i+1));save()}function points(i,n){teams[i].score=Math.max(0,teams[i].score+n);save();renderTeams()}function addTeam(){if(teams.length>=12)return alert('الحد الأقصى 12 فريقًا');teams.push({name:'فريق '+(teams.length+1),score:0});save();renderTeams()}function resetScores(){if(confirm('هل تريد تصفير جميع نقاط الفرق؟')){teams.forEach(x=>x.score=0);save();renderTeams()}}function exportScores(){const rows=[['team','score'],...teams.map(t=>[t.name,t.score])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ai-workshop-scores.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function renderLeaderboard(){const el=document.getElementById('leaderboardMount');if(el)el.innerHTML=`<div class="cards">${[...teams].sort((a,b)=>b.score-a.score).slice(0,6).map((t,i)=>`<div class="card"><div class="num">${['🥇','🥈','🥉'][i]||'⭐'} ${t.score}</div><h3>${esc(t.name)}</h3><p>النقاط الحالية</p></div>`).join('')}</div>`}
let timerTotal=300,timerRemain=300,timerInterval=null;function setTimer(min){pauseTimer();timerTotal=timerRemain=min*60;drawTimer()}function drawTimer(){let e=document.getElementById('clock');if(e)e.textContent=String(Math.floor(timerRemain/60)).padStart(2,'0')+':'+String(timerRemain%60).padStart(2,'0')}function startTimer(){if(timerInterval)return;timerInterval=setInterval(()=>{timerRemain=Math.max(0,timerRemain-1);drawTimer();if(!timerRemain){pauseTimer();alert('انتهى الوقت! ⏰')}},1000)}function pauseTimer(){clearInterval(timerInterval);timerInterval=null}function resetTimer(){pauseTimer();timerRemain=timerTotal;drawTimer()}
function renderQuiz(){const q=questions[quizI];document.getElementById('quizMount').innerHTML=`<div class="panel"><span class="eyebrow">سؤال ${quizI+1} من ${questions.length}</span><h2 style="font-size:clamp(21px,2.7vw,36px)">${q.q}</h2><div class="quizopts">${q.opts.map((o,i)=>`<button class="quizoption ${quizRevealed?(i===q.answer?'answer':'wrong'):''}" onclick="revealQuiz()">${['أ','ب','ج','د'][i]} · ${o}</button>`).join('')}</div>${quizRevealed?`<p style="color:var(--mint);font-size:18px">✓ ${q.why}</p>`:'<p class="help">اسأل كل فريق قبل كشف الإجابة.</p>'}<div class="toolmenu" style="margin-top:15px"><button class="btn gold" onclick="revealQuiz()">كشف الإجابة</button><button class="btn" onclick="quizNext()">السؤال التالي ←</button></div></div>`}function revealQuiz(){quizRevealed=true;renderQuiz()}function quizNext(){quizI=(quizI+1)%questions.length;quizRevealed=false;renderQuiz()}
const labOpts={role:['خبير تسويق','مصمم جرافيك','صحفي محترف','مرشد سياحي','مدير فندق'],task:['اكتب حملة إعلانية','اقترح فكرة بصرية','أنشئ سيناريو فيديو قصير','صمّم خطة عمل','اكتب أسئلة مقابلة'],audience:['طلاب الجامعة في مصراتة','زوّار ليبيا','الجمهور الليبي العام','عملاء فندق افتراضي'],format:['3 أفكار في نقاط','جدول عملي','نص من 100 كلمة','سيناريو 4 مشاهد']};function renderLab(){const opt=(key,title)=>`<div><label>${title}</label><select class="input" id="lab_${key}" onchange="updatePrompt()">${labOpts[key].map(x=>`<option>${x}</option>`).join('')}</select></div>`;document.getElementById('labMount').innerHTML=`<div class="cols"><div class="panel">${opt('role','الدور')}${opt('task','المهمة')}${opt('audience','الجمهور المستهدف')}${opt('format','شكل النتيجة')}</div><div class="panel"><h3>الأمر الناتج</h3><div class="promptout" id="promptout"></div><button class="btn gold" style="margin-top:15px" onclick="copyPrompt()">نسخ الأمر 📋</button></div></div>`;updatePrompt()}function updatePrompt(){const get=k=>document.getElementById('lab_'+k)?.value||'';document.getElementById('promptout').textContent=`تصرّف كأنك ${get('role')}.\n\nالمهمة: ${get('task')} تستهدف ${get('audience')}.\n\nالمطلوب: قدم نتيجة مبتكرة وعملية مناسبة للثقافة المحلية. تجنب الادعاءات غير الموثقة.\n\nشكل الإخراج: ${get('format')}.\n\nابدأ بسؤال توضيحي واحد فقط إذا كان ضروريًا.`}function copyPrompt(){const t=document.getElementById('promptout').textContent;navigator.clipboard?.writeText(t).then(()=>alert('تم النسخ')).catch(()=>window.prompt('انسخ الأمر:',t))}
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='Escape'){closeOverlay();if(showNotes)toggleNotes();return}if(document.getElementById('overlay').classList.contains('open'))return;if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();next(1)}if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();next(-1)}if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='g')openOverlay('teams')});render();
</script></body></html>
